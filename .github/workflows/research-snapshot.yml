name: Architecture validation assets

on:
  push:
    branches: [compiler-architecture-white-paper]
    paths: [.github/workflows/research-snapshot.yml]

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Acquire the publication's pinned browser assets and Python wheels
        run: |
          python -m pip install -r requirements.txt
          python scripts/vendor.py
          mkdir -p validation-assets
          cp -a vendor validation-assets/
          python -m pip download -r requirements.txt -r requirements-dev.txt -d validation-assets/wheels
          tar -czf architecture-validation-assets.tar.gz validation-assets
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: architecture-validation-assets
          path: architecture-validation-assets.tar.gz
          retention-days: 7
          compression-level: 0
